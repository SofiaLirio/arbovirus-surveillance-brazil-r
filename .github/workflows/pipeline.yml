name: pipeline

# Manual only (Actions tab -> pipeline -> Run workflow): the full run takes up to 45 minutes.
# It rebuilds outputs/ and figures/ from the committed db/ (raw/ is not in the repository).
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: System libraries for sf
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript R/install_packages.R

      - name: Run core pipeline
        run: Rscript pipelines/run_all.R

      - name: Regenerate alternative-view figures
        run: Rscript pipelines/alt_results.R

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
          if-no-files-found: error

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          if-no-files-found: error
